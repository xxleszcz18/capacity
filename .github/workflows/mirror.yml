name: Mirror to Autoneum777

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Autoneum777/capacity
        run: |
          git push --force \
            https://Autoneum777:${{ secrets.AUTONEUM_TOKEN }}@github.com/Autoneum777/capacity.git \
            HEAD:main
