name: Mirror to Autoneum777

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Autoneum777/capacity
        env:
          TOKEN: ${{ secrets.AUTONEUM_TOKEN }}
        run: |
          git remote add mirror https://Autoneum777:${TOKEN}@github.com/Autoneum777/capacity.git
          git push mirror --force HEAD:main
